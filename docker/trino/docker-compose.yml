# =====================================================================
#  DESTINO - Trino + Apache Iceberg (lakehouse)
#  - minio            : almacenamiento S3 para los datos Iceberg
#  - minio-init       : crea el bucket del warehouse
#  - iceberg-postgres : catalogo Iceberg JDBC (metadatos de tablas)
#  - trino            : motor SQL destino (http://localhost:8080)
#  Todas las imagenes son multi-arquitectura (amd64 / arm64 -> DGX Spark).
# =====================================================================
name: cdp-target

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cdp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [cdp-net]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: cdp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${ICEBERG_BUCKET} &&
      echo 'bucket listo'"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_password}
      ICEBERG_BUCKET: ${ICEBERG_BUCKET:-warehouse}
    restart: "no"
    networks: [cdp-net]

  iceberg-postgres:
    image: postgres:16-alpine
    container_name: cdp-iceberg-postgres
    environment:
      POSTGRES_USER: ${ICEBERG_DB_USER:-iceberg}
      POSTGRES_PASSWORD: ${ICEBERG_DB_PASSWORD:-iceberg_password}
      POSTGRES_DB: ${ICEBERG_DB_NAME:-iceberg_catalog}
    volumes:
      - iceberg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ICEBERG_DB_USER:-iceberg} -d ${ICEBERG_DB_NAME:-iceberg_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [cdp-net]

  trino:
    image: trinodb/trino:${TRINO_VERSION:-476}
    container_name: cdp-trino
    hostname: trino
    depends_on:
      iceberg-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # usadas por etc/catalog/iceberg.properties via ${ENV:...}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER:-iceberg}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:-iceberg_password}
      ICEBERG_DB_NAME: ${ICEBERG_DB_NAME:-iceberg_catalog}
      ICEBERG_BUCKET: ${ICEBERG_BUCKET:-warehouse}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_password}
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
      - ../../sql:/opt/cdp/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [cdp-net]

volumes:
  minio-data:
  iceberg-postgres-data:

networks:
  cdp-net:
    name: ${CDP_NETWORK:-cdp-migration-net}
