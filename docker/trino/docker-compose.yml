\ cambios, reinicia Hue para que lea la configuración:

docker restart cdp-hue
Luego, en http://localhost:8888, elige Editor → Trino (destino). A la izquierda aparece el navegador iceberg → db_production / db_consulting. No lo pude probar aquí; si el editor Trino no aparece o da error, pásame el log y lo ajusto:

docker logs cdp-hue --tail 50: [cdp-net]

  s3-init:
    image: amazon/aws-cli:${AWS_CLI_VERSION:-2.15.0}
    container_name: cdp-s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cdp_access_key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-cdp_secret_key_change_me}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${ICEBERG_BUCKET:-warehouse}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        EP=http://seaweedfs:8333
        for i in $$(seq 1 30); do
          if aws --endpoint-url $$EP s3api head-bucket --bucket $$BUCKET 2>/dev/null; then
            echo "bucket $$BUCKET ya existe"; exit 0
          fi
          if aws --endpoint-url $$EP s3 mb s3://$$BUCKET; then
            echo "bucket $$BUCKET creado"; exit 0
          fi
          echo "S3 aun no disponible, reintentando ($$i)..."; sleep 3
        done
        echo "no se pudo crear el bucket" >&2; exit 1
    restart: "no"
    networks: [cdp-net]

  iceberg-postgres:
    image: postgres:16-alpine
    container_name: cdp-iceberg-postgres
    environment:
      POSTGRES_USER: ${ICEBERG_DB_USER:-iceberg}
      POSTGRES_PASSWORD: ${ICEBERG_DB_PASSWORD:-iceberg_password}
      POSTGRES_DB: ${ICEBERG_DB_NAME:-iceberg_catalog}
    volumes:
      - iceberg-postgres-data:/var/lib/postgresql/data
      # Tablas que exige el catalogo Iceberg JDBC de Trino (solo corre con volumen nuevo;
      # scripts/target_init.sh las aplica tambien sobre volumenes existentes)
      - ../../sql/target/00_iceberg_jdbc_catalog.sql:/docker-entrypoint-initdb.d/00_iceberg_jdbc_catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ICEBERG_DB_USER:-iceberg} -d ${ICEBERG_DB_NAME:-iceberg_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [cdp-net]

  trino:
    image: trinodb/trino:${TRINO_VERSION:-476}
    container_name: cdp-trino
    hostname: trino
    depends_on:
      iceberg-postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      # usadas por etc/catalog/iceberg.properties via ${ENV:...}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER:-iceberg}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:-iceberg_password}
      ICEBERG_DB_NAME: ${ICEBERG_DB_NAME:-iceberg_catalog}
      ICEBERG_BUCKET: ${ICEBERG_BUCKET:-warehouse}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cdp_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cdp_secret_key_change_me}
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
      - ../../sql:/opt/cdp/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [cdp-net]

volumes:
  seaweedfs-data:
  iceberg-postgres-data:

networks:
  cdp-net:
    name: ${CDP_NETWORK:-cdp-migration-net}
