# Catalogo destino: Apache Iceberg con catalogo JDBC (PostgreSQL) y datos en MinIO (S3)
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=cdp_lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://iceberg-postgres:5432/${ENV:ICEBERG_DB_NAME}
iceberg.jdbc-catalog.connection-user=${ENV:ICEBERG_DB_USER}
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_DB_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://${ENV:ICEBERG_BUCKET}/
iceberg.file-format=PARQUET

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
