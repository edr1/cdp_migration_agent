# =====================================================================
# Hue - configuracion para el ORIGEN local (sobrescribe hue.ini de la imagen)
# Credenciales solo para desarrollo local; hue-postgres no se expone al host.
# =====================================================================
[desktop]
  secret_key=cdp-migration-local-dev-secret-key-change-me
  http_host=0.0.0.0
  http_port=8888
  time_zone=UTC
  django_debug_mode=false
  # Ocultar apps que no aplican a esta emulacion (sin HDFS/YARN/Oozie/Solr/HBase)
  app_blacklist=search,hbase,security,oozie,pig,spark,sqoop,zookeeper,jobbrowser,filebrowser,indexer

  [[database]]
    engine=postgresql_psycopg2
    host=hue-postgres
    port=5432
    user=hue
    password=hue_password
    name=hue

[notebook]
  [[interpreters]]
    [[[hive]]]
      name=Hive
      interface=hiveserver2

    # Requiere el perfil "impala" (make source-up-impala)
    [[[impala]]]
      name=Impala
      interface=hiveserver2

    # DESTINO: Trino (comparten la red cdp-migration-net). Requiere "make target-up".
    [[[trino]]]
      name=Trino (destino)
      interface=trino
      options='{"url": "http://trino:8080"}'

[beeswax]
  hive_server_host=hiveserver2
  hive_server_port=10000

[impala]
  server_host=impalad
  server_port=21050

[metastore]
  enable_new_create_table=true
